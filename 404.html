<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | SmartFiQ</title>
    <link rel="icon" type="image/jpeg" href="favicon.jpeg" />
    <link rel="apple-touch-icon" href="smartfiq-ai-automation-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0A0A0A; color: #e5e2e1; }
        .glass-panel { background: #1A1A1A; border: 1px solid rgba(255, 86, 37, 0.15); }
        .lava-text { background: linear-gradient(135deg, #FF6B3D 0%, #FF3D00 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#0A0A0A] text-gray-200">
    <div id="site-header" class="min-h-[84px]"></div>

    <main class="flex-grow flex items-center justify-center py-20 px-4">
        <div class="glass-panel max-w-lg w-full p-8 sm:p-12 rounded-3xl text-center space-y-6 shadow-2xl">
            <div class="w-20 h-20 mx-auto rounded-full bg-[#ff5625]/10 flex items-center justify-center text-[#ff5625]">
                <span class="material-symbols-outlined text-4xl">error_outline</span>
            </div>
            <span class="text-[#ff5625] text-sm font-bold uppercase tracking-widest">Error 404</span>
            <h1 class="text-4xl font-extrabold text-white tracking-tight">Page Not Found</h1>
            <p class="text-gray-400 text-sm leading-relaxed">
                The page you are looking for might have been moved, renamed, or is temporarily unavailable.
            </p>
            <div class="pt-4">
                <a href="index.html" class="inline-flex items-center gap-2 px-8 py-3.5 bg-gradient-to-r from-[#ff5625] to-[#920703] text-white font-bold text-sm rounded-xl shadow-lg hover:scale-105 transition-transform">
                    <span class="material-symbols-outlined text-sm">home</span>
                    Back to Homepage
                </a>
            </div>
        </div>
    </main>

    <div id="site-modal"></div>
    <div id="site-footer"></div>
    <script src="components.js"></script>
    <script src="cms-engine.js"></script>
</body>
</html>
